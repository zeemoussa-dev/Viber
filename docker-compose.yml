services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: viber
      POSTGRES_PASSWORD: viber_dev
      POSTGRES_DB: viber
    volumes:
      - viber_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viber -d viber"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      VIBER_DATABASE_URL: postgresql://viber:viber_dev@db:5432/viber
      VIBER_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8088"
    command: uvicorn viber.main:app --host 0.0.0.0 --port 8088

  tests:
    build: .
    profiles: ["tests"]
    environment:
      VIBER_DATABASE_URL: postgresql://viber:viber_dev@db:5432/viber_test
      VIBER_ADMIN_DATABASE_URL: postgresql://viber:viber_dev@db:5432/viber
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests
    command: pytest -q

volumes:
  viber_pgdata:
