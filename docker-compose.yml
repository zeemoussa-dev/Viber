# Configuration comes from a .env file next to this one (see .env.example); every default below
# matches a plain local development setup, so `docker compose up -d --build` works with no .env at all.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: viber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viber_dev}
      POSTGRES_DB: viber
    volumes:
      - viber_pgdata:/var/lib/postgresql/data
    ports:
      - "${VIBER_BIND:-127.0.0.1}:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viber -d viber"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Viber's own embedding service: meaning search never waits on any other product. Ollama serves the model; the
  # first start pulls it into the viber_embed_models volume (about 1.2 GB for bge-m3) and shows in /v1/memory-health
  # until it is ready. Set VIBER_EMBED_PROVIDER=none for keyword-only recall, or openai plus VIBER_EMBED_URL to use
  # any OpenAI-compatible endpoint instead. Not published on the host.
  embeddings:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama list | grep -q \"$$VIBER_EMBED_MODEL\" || ollama pull \"$$VIBER_EMBED_MODEL\"; wait"]
    environment:
      VIBER_EMBED_MODEL: ${VIBER_EMBED_MODEL:-bge-m3}
    volumes:
      - viber_embed_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$$VIBER_EMBED_MODEL\""]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 20s

  api:
    build:
      context: .
      target: with-dashboard
    restart: unless-stopped
    environment:
      VIBER_DATABASE_URL: postgresql://viber:${POSTGRES_PASSWORD:-viber_dev}@db:5432/viber
      VIBER_TOKEN: ${VIBER_TOKEN:-}
      VIBER_EMBED_PROVIDER: ${VIBER_EMBED_PROVIDER:-ollama}
      VIBER_EMBED_URL: ${VIBER_EMBED_URL:-http://embeddings:11434}
      VIBER_EMBED_MODEL: ${VIBER_EMBED_MODEL:-bge-m3}
      VIBER_EMBED_KEY: ${VIBER_EMBED_KEY:-}
      VIBER_BACKUP_DIR: /backups
      VIBER_BACKUP_EVERY_HOURS: ${VIBER_BACKUP_EVERY_HOURS:-24}
    volumes:
      # Backups land in ./backups on the host, so they outlive the Docker volumes and can be copied anywhere.
      - ${VIBER_BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${VIBER_BIND:-127.0.0.1}:${VIBER_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    command: uvicorn viber.main:app --host 0.0.0.0 --port 8088

  tests:
    build:
      context: .
      target: app
    profiles: ["tests"]
    environment:
      VIBER_DATABASE_URL: postgresql://viber:${POSTGRES_PASSWORD:-viber_dev}@db:5432/viber_test
      VIBER_ADMIN_DATABASE_URL: postgresql://viber:${POSTGRES_PASSWORD:-viber_dev}@db:5432/viber
      VIBER_EMBED_PROVIDER: none
      VIBER_EMBED_AUTOSYNC: "0"
      VIBER_BACKUP_DIR: /tmp/viber-test-backups
      VIBER_BACKUP_EVERY_HOURS: "0"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests
    command: pytest -q

volumes:
  viber_pgdata:
  viber_embed_models:
